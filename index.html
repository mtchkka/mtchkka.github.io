<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mat’s Portfolio</title>
  <style>
    /* ---------- Colors ---------- */
    :root {
      --paper: #f7f2ff;
      --ink: #231942;
      --berry: #e5446d;
      --mint: #a8e6cf;
      --sun: #ffd166;
      --dark: #1e1e24;
      --dark-2: #2a2a32;
      --muted: #8e8ea0;
    }

    /* ---------- Page ---------- */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Verdana, Arial, sans-serif; line-height: 1.7; }
    h1, h2 { font-family: Georgia, serif; }
    a { color: var(--berry); font-weight: bold; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--berry); outline-offset: 3px; }

    header { position: relative; background: var(--sun); text-align: center; padding: 64px 20px 44px; border-bottom: 4px solid var(--ink); }
    header h1 { font-size: 2.6rem; margin: 24px 0 8px; }
    header p { max-width: 34rem; margin: 0 auto; font-size: 1.1rem; }

    .lang { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
    .lang button { font: bold 0.9rem Verdana, Arial, sans-serif; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    .lang button.active { background: var(--ink); color: var(--paper); }

    main { max-width: 860px; margin: 0 auto; padding: 8px 20px; }
    section { margin: 44px 0; }
    h2 { display: inline-block; font-size: 1.8rem; border-bottom: 4px solid var(--berry); margin: 0 0 16px; }
    .hint { margin: 0 0 14px; }
    footer { text-align: center; padding: 28px 20px; border-top: 4px solid var(--ink); }

    /* ---------- Window with tabs ---------- */
    .window { background: var(--dark); border: 1px solid rgba(0, 0, 0, 0.25); border-radius: 12px; box-shadow: 0 16px 40px rgba(35, 25, 66, 0.2); overflow: hidden; font-family: Consolas, "Courier New", monospace; }
    .titlebar { display: flex; align-items: center; gap: 14px; background: var(--dark-2); padding: 10px 14px; }
    .dots { display: flex; gap: 8px; flex-shrink: 0; }
    .dots span { width: 12px; height: 12px; border-radius: 50%; }
    .dots span:nth-child(1) { background: #ff5f57; }
    .dots span:nth-child(2) { background: #febc2e; }
    .dots span:nth-child(3) { background: #28c840; }

    .tabs { display: flex; gap: 2px; overflow-x: auto; }
    .tab { font: 0.85rem -apple-system, "Segoe UI", Verdana, sans-serif; color: #9a9aa8; background: none; border: none; border-radius: 6px; padding: 5px 12px; white-space: nowrap; cursor: pointer; }
    .tab:hover, .tab.active { color: var(--paper); }
    .tab.active { background: rgba(255, 255, 255, 0.12); }

    /* Only the active tab's panel is shown. All panels have the same minimum height. */
    .panel { position: relative; display: none; flex-direction: column; gap: 14px; min-height: 27.5rem; padding: 20px; color: var(--paper); }
    .panel.active { display: flex; }
    .grow { flex: 1; }   /* this element takes all the free space in the panel */

    /* ---------- Boxes, pictures, videos ---------- */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .box { display: grid; align-content: center; gap: 8px; margin: 0; padding: 16px 18px; background: rgba(255, 255, 255, 0.06); border-radius: 10px; font: 0.95rem/1.7 Verdana, Arial, sans-serif; }
    .box p { margin: 0; }
    .box a { color: var(--sun); }

    .media { position: relative; display: flex; align-items: center; justify-content: center; margin: 0; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
    .media::before { content: attr(data-src); padding: 8px; color: var(--muted); font-size: 0.85rem; text-align: center; }  /* file name shown until the file exists */
    .media img, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .media:has(img), .media:has(video) { cursor: zoom-in; }
    .media:has(video)::after { content: "▶"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: #fff; pointer-events: none; }
    .wide { aspect-ratio: 16 / 9; }
    .grow .media { min-height: 180px; }

    /* ---------- Code tab ---------- */
    .code { counter-reset: line; }
    .l { position: relative; min-height: 1.9em; padding-left: 3rem; line-height: 1.9; white-space: pre-wrap; }
    .l::before { counter-increment: line; content: counter(line); position: absolute; left: 0; width: 1.8rem; text-align: right; color: #6e6e7c; }
    .k { color: #ff8fb0; }   /* keywords */
    .s { color: var(--mint); }   /* strings */
    .c { color: var(--muted); }   /* comments */

    /* ---------- Full-screen viewer ---------- */
    dialog { width: 100%; height: 100%; max-width: none; max-height: none; padding: 16px; border: none; background: rgba(0, 0, 0, 0.92); cursor: zoom-out; }
    dialog[open] { display: flex; align-items: center; justify-content: center; }
    dialog img, dialog video { max-width: 100%; max-height: 100%; border-radius: 8px; }
    dialog button { position: absolute; top: 12px; right: 18px; font-size: 2rem; line-height: 1; color: #fff; background: none; border: none; cursor: pointer; }
    dialog button:focus-visible { outline-color: #fff; }

    /* Easter egg: little green button in the corner of the skills.blend tab */
    .panel:has(.egg) { padding-bottom: 60px; }   /* leaves room for the button under the text box */
    .egg { position: absolute; left: 20px; bottom: 14px; width: 34px; height: 34px; padding: 0; border: none; border-radius: 50%; background: #28c840; color: #0b3d16; font: bold 0.8rem Verdana, Arial, sans-serif; cursor: pointer; animation: pulse 2s infinite; }
    .egg:hover { transform: scale(1.1); }
    @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(40, 200, 64, 0.6); } to { box-shadow: 0 0 0 12px rgba(40, 200, 64, 0); } }
    @media (prefers-reduced-motion: reduce) { .egg { animation: none; } }
    dialog model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; }
    dialog[data-error]::before { content: attr(data-error); color: var(--muted); font-family: Consolas, "Courier New", monospace; }   /* shown if the model file is missing */

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="lang" aria-label="Language">
      <button onclick="setLanguage('en')" data-lang="en">EN</button>
      <button onclick="setLanguage('cs')" data-lang="cs">CS</button>
    </nav>
    <h1 data-i18n="hello"></h1>
    <p data-i18n="tagline"></p>
  </header>

  <main>
    <section>
      <h2 data-i18n="about_h"></h2>
      <p data-i18n="about_p"></p>
    </section>

    <section>
      <h2 data-i18n="files_h"></h2>
      <p class="hint" data-i18n="hint"></p>

      <div class="window">
        <div class="titlebar">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="tabs">
            <button class="tab active" data-tab="stl" onclick="showTab('stl')">3dprint.stl</button>
            <button class="tab" data-tab="pdf" onclick="showTab('pdf')">hardware.pdf</button>
            <button class="tab" data-tab="cpp" onclick="showTab('cpp')">skills.cpp</button>
            <button class="tab" data-tab="blend" onclick="showTab('blend')">skills.blend</button>
            <button class="tab" data-tab="af" onclick="showTab('af')">drawings.af</button>
            <button class="tab" data-tab="ppt" onclick="showTab('ppt')">other.pptx</button>
          </div>
        </div>

        <!-- Pictures and videos: just put the file path in data-src (.mp4 = video) -->

        <div class="panel active" data-tab="stl">
          <div class="grid grow">
            <div class="box">
              <p data-i18n="stl_t"></p>
              <a href="models/bonbon.stl" download data-i18n="stl_dl"></a>
            </div>
            <figure class="media" data-src="images/bonbon.jpg" data-alt="My 3D-printed bonbon"></figure>
          </div>
        </div>

        <div class="panel" data-tab="pdf">
          <div class="grid grow">
            <figure class="media" data-src="images/setup.jpg" data-alt="My setup"></figure>
            <figure class="media" data-src="images/homelab.jpg" data-alt="My homelab"></figure>
          </div>
          <p class="box" data-i18n="hw_t"></p>
        </div>

        <div class="panel" data-tab="cpp">
          <div class="code">
            <div class="l"><span class="k">#include</span> &lt;vector&gt;</div>
            <div class="l"><span class="k">#include</span> &lt;string&gt;</div>
            <div class="l"></div>
            <div class="l"><span class="k">struct</span> Skill { std::string name; std::string level; };</div>
            <div class="l"></div>
            <div class="l c">// <span data-i18n="cpp_c"></span></div>
            <div class="l">std::vector&lt;Skill&gt; everything_i_know = {</div>
            <div class="l">    {<span class="s">"C++"</span>, <span class="s">"<span data-i18n="learning"></span>"</span>},</div>
            <div class="l">    {<span class="s">"Python"</span>, <span class="s">"<span data-i18n="basics"></span>"</span>},</div>
            <div class="l">    {<span class="s">"C#"</span>, <span class="s">"<span data-i18n="learning"></span>"</span>},</div>
            <div class="l">    {<span class="s">"HTML + CSS"</span>, <span class="s">"<span data-i18n="learning"></span>"</span>},</div>
            <div class="l">    {<span class="s">"AI"</span>, <span class="s">"<span data-i18n="learning"></span>"</span>}</div>
            <div class="l">};</div>
          </div>
        </div>

        <div class="panel" data-tab="blend">
          <div class="grid">
            <figure class="media wide" data-src="images/gummy-bear.jpg" data-alt="My gummy bear character"></figure>
            <figure class="media wide" data-src="videos/gummy-bear.mp4"></figure>
          </div>
          <p class="box grow" data-i18n="blend_t"></p>
          <button class="egg" onclick="openModel()" aria-label="Show 3D model">3D</button>
        </div>

        <div class="panel" data-tab="af">
          <div class="grid">
            <figure class="media wide" data-src="images/drawing-1.png" data-alt="Drawing 1"></figure>
            <figure class="media wide" data-src="images/drawing-2.png" data-alt="Drawing 2"></figure>
          </div>
          <p class="box grow" data-i18n="af_t"></p>
        </div>

        <div class="panel" data-tab="ppt">
          <div class="grid">
            <figure class="media wide" data-src="images/slide-1.png" data-alt="A slide from my presentations"></figure>
            <p class="box" data-i18n="ppt_1"></p>
          </div>
          <div class="grid">
            <p class="box" data-i18n="ppt_2"></p>
            <figure class="media wide" data-src="images/slide-2.png" data-alt="A slide from my presentations"></figure>
          </div>
          <div class="grid">
            <figure class="media wide" data-src="images/slide-3.png" data-alt="A slide from my presentations"></figure>
            <p class="box" data-i18n="ppt_3"></p>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2 data-i18n="contact_h"></h2>
      <p><span data-i18n="contact_p"></span> <a href="mailto:mtchkka@icloud.com">mtchkka@icloud.com</a></p>
    </section>
  </main>

  <footer>
    <p>mtchkka, Claude</p>
  </footer>

  <!-- Full-screen viewer for pictures and videos -->
  <dialog id="viewer"><button aria-label="Close">×</button></dialog>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script>
    // All texts live here. The key (like "about_p") matches data-i18n="about_p" in the HTML.
    const text = {
      en: {
        hello: "mtchkka. Hi",
        tagline: "Second-year IT student in Prague. I make things with 3D, code and design.",
        about_h: "About me",
        about_p: "I study at an IT-focused secondary school, where I learn graphic design, coding, robotics and much more. I speak Czech, Russian and English. In my free time I build small projects and learn something new from each one.",
        files_h: "My skills",
        hint: "Click a file to open it.",
        basics: "basics",
        learning: "learning",
        stl_t: "BonBon from FNAF: SL, my first big project on a 3D printer.",
        hw_t: "Raspberry Pi project, HomeLab.",
        blend_t: "My gummy bear character, which I model, texture and animate in Blender.",
        af_t: "Pictures I drew.",
        ppt_1: "X",
        ppt_2: "X",
        ppt_3: "X",
        contact_h: "Contact",
        contact_p: "Write to me at"
      },
      cs: {
        hello: "mtchkka. Ahoj",
        tagline: "Studuji druhý ročník IT školy v Praze. Tvořím věci ve 3D, v kódu a v designu.",
        about_h: "O mně",
        about_p: "Studuji střední školu zaměřenou na IT, kde se učím grafický design, programování, robotiku a mnoho dalšího. Mluvím česky, rusky a anglicky. Ve volném čase dělám malé projekty a z každého se naučím něco nového.",
        files_h: "Moje dovednosti",
        hint: "Klikni na soubor, který chceš otevřít.",
        basics: "základy",
        learning: "učím se",
        stl_t: "BonBon ze hry FNAF: SL, můj první větší projekt na šD tiskárně.",
        hw_t: "Raspberry Pi projekt, HomeLab.",
        blend_t: "Moje postavička gumového medvídka, kterou modeluji, texturuji a animuji v Blenderu.",
        af_t: "Obrázky, které jsem nakreslil.",
        ppt_1: "X",
        ppt_2: "X",
        ppt_3: "X",
        contact_h: "Kontakt",
        contact_p: "Napište mi na"
      }
    };

    // Show one tab: the clicked tab and its panel get the class "active"
    function showTab(name) {
      document.querySelectorAll("[data-tab]").forEach(function (el) {
        el.classList.toggle("active", el.dataset.tab === name);
      });
    }

    // Switch language: fill every data-i18n element with its text
    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = text[lang][el.dataset.i18n];
      });
      document.querySelectorAll("[data-lang]").forEach(function (button) {
        button.classList.toggle("active", button.dataset.lang === lang);
      });
      localStorage.setItem("lang", lang);
    }

    // Build the pictures and videos from data-src (a missing file just keeps its placeholder)
    document.querySelectorAll(".media").forEach(function (box) {
      const src = box.dataset.src;
      const file = document.createElement(src.endsWith(".mp4") ? "video" : "img");
      file.onerror = function () { file.remove(); };
      file.alt = box.dataset.alt || "";
      file.muted = true;
      file.preload = "metadata";
      file.src = src.endsWith(".mp4") ? src + "#t=0.1" : src;   // #t=0.1 shows a first frame
      box.append(file);
    });

    // Click a picture or video to open it full screen
    const viewer = document.getElementById("viewer");

    document.addEventListener("click", function (event) {
      const box = event.target.closest(".media");
      const file = box && box.querySelector("img, video");
      if (!file) return;
      const big = document.createElement(file.tagName);
      big.src = box.dataset.src;
      if (big.tagName === "VIDEO") {
        big.controls = true;
        big.autoplay = true;
      }
      viewer.prepend(big);
      viewer.showModal();
    });

    // Easter egg: the little green button opens the 3D model (export it from Blender as .glb)
    function openModel() {
      const file = "models/gummy-bear.glb";
      const model = document.createElement("model-viewer");
      model.setAttribute("src", file);
      model.setAttribute("alt", "3D model of my gummy bear character");
      model.setAttribute("camera-controls", "");   // drag to turn, scroll to zoom
      model.setAttribute("auto-rotate", "");
      model.addEventListener("error", function () { viewer.dataset.error = file; });
      viewer.prepend(model);
      viewer.showModal();
    }

    viewer.onclick = function (event) {   // click anywhere (except video controls and the 3D model) to close; Esc works too
      if (event.target.tagName !== "VIDEO" && event.target.tagName !== "MODEL-VIEWER") viewer.close();
    };
    viewer.onclose = function () {
      viewer.firstElementChild.remove();
      viewer.removeAttribute("data-error");
    };

    // Start in the saved language (English the first time)
    const saved = localStorage.getItem("lang");
    setLanguage(text[saved] ? saved : "en");
  </script>

</body>
</html>
